[tool.poetry]
name = "genai-python-onramp"
version = "0.1.0"
description = "A fast-track course for developers learning Python for GenAI."
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
jupyterlab = "^4.0.0"
pandas = "^2.0.0"
pyarrow = "^14.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.13.0"
pydantic = "^2.0.0"
httpx = "^0.25.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.0"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pytest = "^7.4.0"
pre-commit = "^3.5.0"
ruff = "^0.1.0"
black = "^23.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
